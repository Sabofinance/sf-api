<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Verify Your Email – Sabo Finance</title>
    <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500;9..40,600&display=swap" rel="stylesheet" />
    <style>
         :root {
            --dark: #0a1e28;
            --dark-2: #132b37;
            --lime: #c8f032;
            --white: #ffffff;
            --off: #f3f6ef;
            --text: #22312a;
            --border: #dde6d7;
            --muted: #6a7a70;
        }
        
        body {
            background-color: var(--off);
            font-family: 'DM Sans', sans-serif;
        }
        
        .email-wrapper {
            max-width: 600px;
            margin: 48px auto;
            padding: 0 16px;
        }
        
        .card {
            background: var(--white);
            border-radius: 16px;
            overflow: hidden;
        }
        
        .card-header {
            background: linear-gradient(135deg, #0a1e28, #163544);
            padding: 32px 44px;
            text-align: center;
            border-bottom: 4px solid #c8f032;
        }
        
        .card-title {
            font-family: 'DM Serif Display', serif;
            font-size: 34px;
            color: #ffffff;
            letter-spacing: 0.2px;
        }
        
        .card-body {
            padding: 40px 44px;
        }
        
        .greeting {
            font-size: 14.5px;
            color: #3d4d38;
            margin-bottom: 32px;
            line-height: 1.7;
        }
        
        .cta-btn {
            display: inline-flex;
            background: #0a1e28;
            color: #c8f032;
            text-decoration: none;
            font-size: 14px;
            font-weight: 700;
            padding: 14px 24px;
            border-radius: 10px;
        }
        
        .card-footer {
            border-top: 1px solid var(--border);
            padding: 22px 44px;
            font-size: 12px;
            color: var(--muted);
        }
    </style>
</head>

<body>
    <div class="email-wrapper">
        <div class="card">
            <div class="card-header">
                <div style="font-size:11px;color:#d8efcf;letter-spacing:.8px;margin-bottom:10px;">SABO FINANCE</div>
                <div class="card-title">Verify Your Email</div>
            </div>
            <div class="card-body">
                <div class="greeting">
                    Hello <strong>{{name}}</strong>, welcome to Sabo Finance! Please click the button below to verify your email address and activate your account.
                </div>
                <a href="{{verificationLink}}" class="cta-btn">Verify My Email</a>
            </div>
            <div class="card-footer">
                &copy; 2026 Sabo Finance. All rights reserved.
            </div>
        </div>
    </div>
</body>

</html>
