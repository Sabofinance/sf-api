<!DOCTYPE html>
<html>
<head>
  <style>
    body { font-family: Arial, sans-serif; line-height: 1.6; color: #333; }
    .container { max-width: 600px; margin: 0 auto; padding: 20px; }
    .header { text-align: center; margin-bottom: 20px; }
    .content { background: #f9f9f9; padding: 20px; border-radius: 5px; }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h2>Your Bid Has Been Placed</h2>
    </div>
    <div class="content">
      <p>Your bid has been submitted successfully.</p>
      <ul>
        <li>Bid reference: {{reference}}</li>
        <li>Proposed rate: ₦{{proposed_rate_ngn}}</li>
        <li>Amount: {{amount}} {{currency}}</li>
      </ul>
      <p>Your funds of ₦{{total_ngn_at_bid_rate}} are held pending the seller's response.</p>
    </div>
  </div>
</body>
</html>
