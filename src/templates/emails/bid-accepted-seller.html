<!DOCTYPE html>
<html>
<head>
  <style>
    body { font-family: Arial, sans-serif; line-height: 1.6; color: #333; }
    .container { max-width: 600px; margin: 0 auto; padding: 20px; }
    .header { text-align: center; margin-bottom: 20px; }
    .content { background: #f9f9f9; padding: 20px; border-radius: 5px; }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h2>You Accepted a Bid</h2>
    </div>
    <div class="content">
      <p>You have accepted the buyer's bid ({{reference}}). A trade has been created.</p>
      <ul>
        <li>Trade reference: {{trade_reference}}</li>
        <li>Agreed rate: ₦{{proposed_rate_ngn}}</li>
      </ul>
    </div>
  </div>
</body>
</html>
