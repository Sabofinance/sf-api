<!doctype html>
<html lang="en">
  <body style="margin:0;padding:24px;background:#f5f7f3;font-family:Arial,sans-serif;color:#10212b;">
    <div style="max-width:620px;margin:0 auto;background:#fff;border:1px solid #e2e9da;border-radius:16px;overflow:hidden;">
      <div style="background:linear-gradient(120deg,#0a1e28,#173746);padding:26px;border-bottom:4px solid #c8f032;color:#fff;font-size:26px;font-weight:700;">
        Trade completed successfully
      </div>
      <div style="padding:24px;line-height:1.75;font-size:15px;">
        <div style="margin-bottom:12px;">Hello <strong>{{name}}</strong>, your trade has been completed and settled.</div>
        <div style="background:#f4fbd7;border:1px solid #dff187;border-radius:12px;padding:14px;">
          Reference: <strong>{{reference}}</strong><br />
          Amount: <strong>{{amount}} {{currency}}</strong><br />
          Rate: <strong>{{rate}} NGN</strong><br />
          Total settled: <strong>{{totalNgn}} NGN</strong>
        </div>
        <div style="margin-top:14px;background:#f7faf2;border-left:3px solid #0a1e28;padding:12px;font-size:13px;color:#425247;">
          Thank you for trading with Sabo Finance. You can review full transaction details in your trade history.
        </div>
      </div>
    </div>
  </body>
</html>
